# SPA + proxy a la API: mismo origen → el CORS deja de importar.
# "backend" es el nombre del servicio en la red interna de Docker.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El equivalente del proxy de Vite en producción
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: /login, /reportes, etc. son rutas de React Router;
    # si el archivo no existe, sirva el index.html para que React lo resuelva.
    location / {
        try_files $uri /index.html;
    }
}
