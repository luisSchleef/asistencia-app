services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: America/Santiago
      POSTGRES_USER: ${POSTGRES_USER:-asistencias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asistencias}
      POSTGRES_DB: ${POSTGRES_DB:-asistencias}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asistencias} -d ${POSTGRES_DB:-asistencias}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      TZ: America/Santiago
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-asistencias}
      DB_USERNAME: ${POSTGRES_USER:-asistencias}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-asistencias}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-no-usar-en-produccion-0123456789-abcdef}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v3/api-docs > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
